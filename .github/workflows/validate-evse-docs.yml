name: Validate EVSE documentation links

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - ".github/workflows/validate-evse-docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - ".github/workflows/validate-evse-docs.yml"

permissions:
  contents: read

jobs:
  validate-local-markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate relative links in changed Markdown files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          base = os.environ.get("BASE_SHA", "")
          if not base or set(base) == {"0"}:
              print("No usable base SHA supplied; refusing to report a false pass.", file=sys.stderr)
              sys.exit(2)

          changed = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMRT", f"{base}...HEAD"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          markdown = [Path(name) for name in changed if name.lower().endswith(".md")]
          if not markdown:
              print("No changed Markdown files in this event; nothing to validate.")
              sys.exit(0)

          link_pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)]+)\)")
          failures = []
          checked = 0

          for source in markdown:
              if not source.is_file():
                  continue
              text = source.read_text(encoding="utf-8")
              for raw in link_pattern.findall(text):
                  target = raw.strip().split(maxsplit=1)[0].strip("<>")
                  parsed = urlsplit(target)
                  if not target or parsed.scheme or target.startswith("//") or not parsed.path:
                      continue
                  relative = unquote(parsed.path)
                  resolved = (source.parent / relative).resolve()
                  checked += 1
                  if not resolved.exists():
                      failures.append(f"{source}: broken local link: {target}")

          print(f"Checked {checked} relative Markdown links across {len(markdown)} changed file(s).")
          if failures:
              print("\\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("All checked relative Markdown links resolve.")
          PY
