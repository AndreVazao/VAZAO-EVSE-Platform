name: TestStation V1 read-only MASTER audit

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to audit (normally current main HEAD)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: teststation-master-audit-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  audit-master:
    name: KiCad 10 read-only MASTER audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate requested commit and checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Verify source identity and stage immutable audit copy
        id: source
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "target_sha must be a full 40-character commit SHA"; exit 2; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || { echo "Checkout SHA mismatch: expected $TARGET_SHA, got $ACTUAL_SHA"; exit 3; }

          MASTER="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch"
          test -s "$MASTER"
          mkdir -p "$RUNNER_TEMP/teststation-master-audit"
          OUT="$RUNNER_TEMP/teststation-master-audit"
          MASTER_COPY="$OUT/TS-V1-M2.9-K-MASTER.kicad_sch"
          cp -- "$MASTER" "$MASTER_COPY"

          SOURCE_BLOB="$(git rev-parse "$ACTUAL_SHA:$MASTER")"
          SOURCE_SHA256="$(sha256sum "$MASTER" | awk '{print $1}')"
          COPY_SHA256="$(sha256sum "$MASTER_COPY" | awk '{print $1}')"
          [[ "$SOURCE_SHA256" == "$COPY_SHA256" ]] || { echo "Staged copy checksum mismatch"; exit 4; }

          {
            echo "Repository: AndreVazao/VAZAO-EVSE-Platform"
            echo "Commit SHA: $ACTUAL_SHA"
            echo "MASTER path: $MASTER"
            echo "MASTER Git blob SHA: $SOURCE_BLOB"
            echo "MASTER SHA-256: $SOURCE_SHA256"
            echo "Audit input: temporary copy only"
            echo "Original repository file modified: NO"
          } > "$OUT/SOURCE-PROVENANCE.txt"

          echo "commit_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "master_blob=$SOURCE_BLOB" >> "$GITHUB_OUTPUT"
          echo "master_sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "master_copy=$MASTER_COPY" >> "$GITHUB_OUTPUT"

      - name: Run existing static symbol pin-map regression checks
        run: |
          python3 hardware/teststation/V1/CAD/verification/scripts/validate_verified_symbol_library.py

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Record KiCad version and validate symbol library through KiCad
        run: |
          set -euo pipefail
          kicad-cli version | tee "$RUNNER_TEMP/teststation-master-audit/KICAD-VERSION.txt"
          mkdir -p "$RUNNER_TEMP/teststation-master-audit/symbol-svg"
          kicad-cli sym export svg \
            --output "$RUNNER_TEMP/teststation-master-audit/symbol-svg" \
            hardware/teststation/V1/CAD/symbols/VAZAO-EVSE-Verified-Components.kicad_sym
          for symbol in ADS131M06IPBSR_unit1.svg AMC1311BDWVR_unit1.svg TMCS1123A3AQDVGR_unit1.svg MEE1S2405SC_unit1.svg ISO1044BDWR_unit1.svg; do
            test -s "$RUNNER_TEMP/teststation-master-audit/symbol-svg/$symbol"
          done

      - name: Run ERC and export netlist from temporary MASTER copy
        id: kicad
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/teststation-master-audit"
          MASTER_COPY="$OUT/TS-V1-M2.9-K-MASTER.kicad_sch"

          set +e
          kicad-cli sch erc --output "$OUT/M2.9-K-MASTER-ERC.rpt" "$MASTER_COPY"
          ERC_EXIT=$?
          set -e
          test -s "$OUT/M2.9-K-MASTER-ERC.rpt"
          echo "erc_exit_code=$ERC_EXIT" >> "$GITHUB_OUTPUT"

          kicad-cli sch export netlist --format kicadxml --output "$OUT/M2.9-K-MASTER.net" "$MASTER_COPY"
          test -s "$OUT/M2.9-K-MASTER.net"

          python3 - "$OUT/M2.9-K-MASTER-ERC.rpt" "$OUT/erc-counts.txt" <<'PY'
          import re, sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          match = re.search(r"\*\*\s*ERC messages:\s*(\d+)\s+Errors\s+(\d+)\s+Warnings\s+(\d+)", report)
          if not match:
              raise SystemExit("Could not parse KiCad ERC total summary")
          total, errors, warnings = map(int, match.groups())
          Path(sys.argv[2]).write_text(
              f"ERC messages: {total}\nErrors: {errors}\nWarnings: {warnings}\n",
              encoding="utf-8",
          )
          print(f"ERC executed: {total} messages; {errors} errors; {warnings} warnings")
          PY

          python3 hardware/teststation/V1/CAD/verification/scripts/audit_master_netlist_connectivity.py \
            "$OUT/M2.9-K-MASTER.net" "$OUT/M2.9-K-NETLIST-CONNECTIVITY-AUDIT.md"

          python3 hardware/teststation/V1/CAD/verification/scripts/summarize_master_erc.py \
            "$OUT/M2.9-K-MASTER-ERC.rpt" "$OUT/M2.9-K-ERC-TRIAGE.md"

          {
            echo "KiCad ERC process exit code: $ERC_EXIT"
            echo "A successful workflow means the audit completed; it does not mean ERC has zero violations."
            cat "$OUT/erc-counts.txt"
            echo
            echo "Netlist connectivity triage:"
            grep -E 'Components:|Nets:|Multi-node nets:|Known suspicious|Connectivity status:' "$OUT/M2.9-K-NETLIST-CONNECTIVITY-AUDIT.md"
            echo
            echo "MASTER source copy SHA-256:"
            sha256sum "$MASTER_COPY"
          } > "$OUT/EXECUTION-SUMMARY.txt"

      - name: Verify repository MASTER remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MASTER="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch"
          if [ -f "$MASTER" ] && [ -f "$RUNNER_TEMP/teststation-master-audit/SOURCE-PROVENANCE.txt" ]; then
            EXPECTED="$(grep '^MASTER SHA-256:' "$RUNNER_TEMP/teststation-master-audit/SOURCE-PROVENANCE.txt" | awk '{print $3}')"
            ACTUAL="$(sha256sum "$MASTER" | awk '{print $1}')"
            echo "Original MASTER SHA-256: $ACTUAL"
            test "$EXPECTED" = "$ACTUAL"
            echo "Original MASTER unchanged: CONFIRMED"
          fi

      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teststation-master-readonly-audit-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/teststation-master-audit/
          if-no-files-found: warn
          retention-days: 30
