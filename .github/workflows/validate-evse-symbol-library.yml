name: Validate EVSE verified symbol library

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-evse-symbol-library.yml'
      - 'hardware/teststation/V1/CAD/symbols/VAZAO-EVSE-Verified-Components.kicad_sym'
      - 'hardware/teststation/V1/CAD/verification/scripts/validate_verified_symbol_library.py'
      - 'hardware/teststation/V1/CAD/verification/netlist/M2.9-K-SYMBOL-TO-FOOTPRINT-PAD-AUDIT.csv'

permissions:
  contents: read
  issues: write

jobs:
  validate-symbol-library:
    if: github.event_name != 'issue_comment' || (github.event.comment.body == '/run-evse-symbol-validation' && github.event.comment.user.login == 'AndreVazao')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static pin-map regression checks
        run: |
          python3 hardware/teststation/V1/CAD/verification/scripts/validate_verified_symbol_library.py

      # The library format version 20231120 requires a KiCad 8+ parser; use stable KiCad 10 in CI.
      - name: Install KiCad 10 CLI for native parser validation
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Confirm KiCad 10 CLI is available
        run: |
          kicad-cli version

      - name: Load and export symbols through KiCad
        run: |
          mkdir -p "$RUNNER_TEMP/evse-symbol-svg"
          kicad-cli sym export svg \
            --output "$RUNNER_TEMP/evse-symbol-svg" \
            hardware/teststation/V1/CAD/symbols/VAZAO-EVSE-Verified-Components.kicad_sym
          test -s "$RUNNER_TEMP/evse-symbol-svg/ADS131M06IPBSR_unit1.svg"
          test -s "$RUNNER_TEMP/evse-symbol-svg/AMC1311BDWVR_unit1.svg"
          test -s "$RUNNER_TEMP/evse-symbol-svg/TMCS1123A3AQDVGR_unit1.svg"
          test -s "$RUNNER_TEMP/evse-symbol-svg/MEE1S2405SC_unit1.svg"
          test -s "$RUNNER_TEMP/evse-symbol-svg/ISO1044BDWR_unit1.svg"

      - name: Run master schematic ERC and export connectivity netlist
        run: |
          mkdir -p "$RUNNER_TEMP/evse-master-audit"
          kicad-cli sch erc --output "$RUNNER_TEMP/evse-master-audit/M2.9-K-MASTER-ERC.rpt" hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch
          kicad-cli sch export netlist --format kicadxml --output "$RUNNER_TEMP/evse-master-audit/M2.9-K-MASTER.net" hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch
          test -s "$RUNNER_TEMP/evse-master-audit/M2.9-K-MASTER-ERC.rpt"
          test -s "$RUNNER_TEMP/evse-master-audit/M2.9-K-MASTER.net"

      - name: Summarize master schematic ERC baseline
        id: erc-summary
        run: |
          python3 - "$RUNNER_TEMP/evse-master-audit/M2.9-K-MASTER-ERC.rpt" <<'PY'
          import os, re, sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          match = re.search(r'\*\*\s*ERC messages:\s*(\d+)\s+Errors\s+(\d+)\s+Warnings\s+(\d+)', report)
          if not match:
              print('ERROR: could not parse ERC summary from generated report', file=sys.stderr)
              sys.exit(1)
          total, errors, warnings = match.groups()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'erc_messages={total}\nerc_errors={errors}\nerc_warnings={warnings}\n')
          print(f'ERC baseline: {total} messages; {errors} errors; {warnings} warnings')
          PY

      - name: Upload master ERC report and netlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evse-master-erc-netlist-${{ github.run_id }}
          path: ${{ runner.temp }}/evse-master-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Report validation result to control issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ercErrors = '${{ steps.erc-summary.outputs.erc_errors }}' || 'unavailable';
            const ercWarnings = '${{ steps.erc-summary.outputs.erc_warnings }}' || 'unavailable';
            const ercMessages = '${{ steps.erc-summary.outputs.erc_messages }}' || 'unavailable';
            const body = `EVSE validation job result: **${result}**\n\nRun: ${runUrl}\nCommit: ${context.sha}\n\nSymbol validation: static pin maps and KiCad SVG export for five draft symbols.\nMaster schematic ERC baseline: ${ercMessages} messages, ${ercErrors} errors, ${ercWarnings} warnings (a tool run is not an ERC pass).\nThe ERC report and exported netlist are attached as workflow artifacts when generated.\n\nThis does not approve footprint pads, circuit connectivity, fabrication, or energization.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body,
            });
