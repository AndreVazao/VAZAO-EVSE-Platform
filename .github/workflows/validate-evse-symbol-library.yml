name: Validate EVSE verified symbol library

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-evse-symbol-library.yml'
      - 'hardware/teststation/V1/CAD/symbols/VAZAO-EVSE-Verified-Components.kicad_sym'
      - 'hardware/teststation/V1/CAD/verification/scripts/validate_verified_symbol_library.py'
      - 'hardware/teststation/V1/CAD/verification/netlist/M2.9-K-SYMBOL-TO-FOOTPRINT-PAD-AUDIT.csv'

permissions:
  contents: read
  issues: write

jobs:
  validate-symbol-library:
    if: github.event_name != 'issue_comment' || (github.event.comment.body == '/run-evse-symbol-validation' && github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static pin-map regression checks
        run: |
          python3 hardware/teststation/V1/CAD/verification/scripts/validate_verified_symbol_library.py

      - name: Install KiCad CLI for native parser validation
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad

      - name: Confirm KiCad CLI is available
        run: |
          kicad-cli version

      - name: Load and export symbols through KiCad
        run: |
          mkdir -p "$RUNNER_TEMP/evse-symbol-svg"
          kicad-cli sym export svg \
            --output "$RUNNER_TEMP/evse-symbol-svg" \
            hardware/teststation/V1/CAD/symbols/VAZAO-EVSE-Verified-Components.kicad_sym
          test -n "$(find "$RUNNER_TEMP/evse-symbol-svg" -type f -name '*.svg' -print -quit)"

      - name: Report validation result to control issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `EVSE symbol-library validation result: **${result}**\n\nRun: ${runUrl}\nCommit: ${context.sha}\n\nA successful run validates the static symbol/pin audit and KiCad symbol-library parser/export only. It does not approve footprints, circuit connectivity, fabrication, or energization.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body,
            });
