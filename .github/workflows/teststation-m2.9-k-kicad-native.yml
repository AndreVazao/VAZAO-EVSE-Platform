name: TestStation M2.9-K KiCad Native Upgrade

on:
  push:
    branches:
      - main
      - feat/charger-hardware-v1
    paths:
      - 'hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.sch'
      - 'hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE-cache.lib'
      - '.github/workflows/teststation-m2.9-k-kicad-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kicad-native-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert legacy schematic through KiCad editor (headless Xvfb)
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.sch"
          NATIVE="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch"
          LOG="hardware/teststation/V1/CAD/verification/M2.9-K-UPGRADE-CLI.log"
          mkdir -p "$(dirname "$LOG")"
          test -s "$LEGACY"
          test -s "hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE-cache.lib"
          rm -f "$NATIVE" "hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.kicad_sch"
          chmod -R a+rwX hardware/teststation/V1/CAD/verification hardware/teststation/V1/CAD/schematics

          {
            echo "Conversion method: KiCad Eeschema legacy importer under Xvfb."
            echo "The legacy source and cache library are preserved; generated native output is accepted only after KiCad writes it."
            timeout 300s docker run --rm -i --user 0:0 \
              -e HOME=/tmp -e DISPLAY=:99 \
              -v "$GITHUB_WORKSPACE:/work" -w /work \
              --entrypoint /bin/bash kicad/kicad:10.0.6 -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          export DISPLAY=:99 HOME=/tmp
          set -x
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xdotool
          command -v eeschema
          command -v Xvfb
          command -v xdotool
          export XDG_RUNTIME_DIR="$(mktemp -d /tmp/runtime.XXXXXX)"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x900x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$XVFB_PID" || { cat /tmp/xvfb.log; exit 1; }

          LEGACY="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.sch"
          EXPECTED="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.kicad_sch"
          rm -f "$EXPECTED"

          # First-run KiCad setup is a modal wizard. Complete it explicitly before
          # treating any editor window as evidence that the legacy file was loaded.
          echo "--- Initialize KiCad user configuration ---"
          eeschema >/tmp/eeschema-setup.log 2>&1 &
          SETUP_PID=$!
          for i in $(seq 1 30); do
            SETUP_WINDOW=""
            for candidate in $(xdotool search --name "KiCad Setup" 2>/dev/null || true); do
              SETUP_WINDOW="$candidate"
              break
            done
            [ -n "$SETUP_WINDOW" ] && break
            if ! kill -0 "$SETUP_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ -n "$SETUP_WINDOW" ]; then
            echo "Detected first-run setup dialog $SETUP_WINDOW; advancing the wizard only while that dialog exists."
            for i in $(seq 1 12); do
              STILL_SETUP=""
              for candidate in $(xdotool search --name "KiCad Setup" 2>/dev/null || true); do
                STILL_SETUP="$candidate"
                break
              done
              [ -z "$STILL_SETUP" ] && break
              xdotool windowfocus "$STILL_SETUP" 2>/dev/null || true
              xdotool key --clearmodifiers Return
              sleep 1
            done
            if xdotool search --name "KiCad Setup" 2>/dev/null | grep -q .; then
              echo "ERROR: KiCad first-run setup did not close after 12 wizard advances."
              cat /tmp/eeschema-setup.log || true
              exit 1
            fi
          else
            echo "No first-run setup dialog detected."
          fi
          kill "$SETUP_PID" 2>/dev/null || true
          wait "$SETUP_PID" 2>/dev/null || true
          sleep 2

          echo "--- Open the actual legacy schematic ---"
          eeschema "$LEGACY" >/tmp/eeschema-import.log 2>&1 &
          EES_PID=$!
          WINDOW=""
          for i in $(seq 1 90); do
            for candidate in $(xdotool search --name ".*M2.9-F-MASTER-BASELINE.*" 2>/dev/null || true); do
              title="$(xdotool getwindowname "$candidate" 2>/dev/null || true)"
              case "$title" in
                *M2.9-F-MASTER-BASELINE*)
                  WINDOW="$candidate"
                  break
                  ;;
              esac
            done
            [ -n "$WINDOW" ] && break
            if ! kill -0 "$EES_PID" 2>/dev/null; then
              echo "Eeschema exited before a window titled for the legacy source appeared."
              break
            fi
            sleep 1
          done

          if [ -z "$WINDOW" ]; then
            echo "ERROR: No editor window naming the legacy source appeared within 90 seconds."
            echo "--- Setup log ---"
            cat /tmp/eeschema-setup.log || true
            echo "--- Import log ---"
            cat /tmp/eeschema-import.log || true
            echo "--- Xvfb log ---"
            cat /tmp/xvfb.log || true
            xdotool search --name ".*" 2>/dev/null | while read -r wid; do
              printf 'WINDOW %s: ' "$wid"
              xdotool getwindowname "$wid" 2>/dev/null || true
            done
            exit 1
          fi

          echo "Confirmed legacy-source editor window $WINDOW: $(xdotool getwindowname "$WINDOW")"
          xdotool windowfocus "$WINDOW" 2>/dev/null || true
          sleep 3

          # Save As is allowed only after the actual source filename appears in the
          # editor title. The original .sch is never overwritten.
          xdotool key --clearmodifiers ctrl+shift+s
          sleep 3
          xdotool key --clearmodifiers ctrl+a
          xdotool type --clearmodifiers --delay 1 "/work/$EXPECTED"
          xdotool key --clearmodifiers Return
          sleep 5
          # Log any prompt/window state rather than blindly assuming the save worked.
          xdotool search --name ".*" 2>/dev/null | while read -r wid; do
            printf 'WINDOW %s: ' "$wid"
            xdotool getwindowname "$wid" 2>/dev/null || true
          done
          sleep 2
          xdotool key --clearmodifiers ctrl+s || true
          sleep 4

          echo "--- Verify native output created by KiCad ---"
          ls -la "$EXPECTED" || true
          cat /tmp/eeschema-import.log || true
          test -s "$EXPECTED" || {
            echo "ERROR: KiCad did not save the native schematic at $EXPECTED"
            exit 1
          }
          head -n 3 "$EXPECTED"
          grep -q "^(kicad_sch" "$EXPECTED"
          cp "$EXPECTED" hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch
          test -s hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch
          grep -q "^(kicad_sch" hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch
          xdotool key --clearmodifiers ctrl+q || true
          sleep 2
          kill "$EES_PID" 2>/dev/null || true
          wait "$EES_PID" 2>/dev/null || true
          CONTAINER_SCRIPT
          } 2>&1 | tee "$LOG"

      - name: Persist KiCad upgrade diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m2.9-k-kicad-upgrade-diagnostics
          path: hardware/teststation/V1/CAD/verification/M2.9-K-UPGRADE-CLI.log
          if-no-files-found: warn

      - name: Run native schematic ERC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardware/teststation/V1/CAD/verification/erc
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work kicad/kicad:10.0.6 \
            kicad-cli sch erc --format report --severity-all \
            --output hardware/teststation/V1/CAD/verification/erc/M2.9-K-MASTER-ERC.rpt \
            hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch

      - name: Write conversion status
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch"
          ERC="hardware/teststation/V1/CAD/verification/erc/M2.9-K-MASTER-ERC.rpt"
          {
            echo "# M2.9-K Native KiCad Conversion — CI Result"
            echo
            echo "**Conversion engine:** KiCad Eeschema legacy importer via Xvfb"
            echo
            echo "**Native schematic:** `$NATIVE`"
            echo
            echo "**ERC report:** `$ERC`"
            echo
            echo "The native file must be produced by KiCad's own editor save path; hand-written S-expression generation is prohibited."
            echo
            echo "Native conversion does **not** imply complete electrical connectivity. Connectivity, pin mapping, ERC and DRC remain engineering gates."
            echo
            echo "## Gates"
            echo "- Native file generated by KiCad: YES (file presence and S-expression header checked)"
            echo "- Native schematic electrically complete: NO — pending connected schematic implementation"
            echo "- ERC executed: YES"
            echo "- DRC: PENDING"
            echo "- Fabrication: NOT AUTHORIZED"
            echo "- Mains energization: NOT AUTHORIZED"
          } > hardware/teststation/V1/CAD/verification/M2.9-K-NATIVE-CI-RESULT.md

      - name: Commit generated native schematic and ERC
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAZAO EVSE Engineering Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch hardware/teststation/V1/CAD/verification/erc/M2.9-K-MASTER-ERC.rpt hardware/teststation/V1/CAD/verification/M2.9-K-NATIVE-CI-RESULT.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(teststation): generate M2.9-K native KiCad schematic"
          git push
