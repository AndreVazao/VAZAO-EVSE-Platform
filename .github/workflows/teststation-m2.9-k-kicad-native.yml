name: TestStation M2.9-K KiCad Native Upgrade

on:
  push:
    branches:
      - feat/charger-hardware-v1
    paths:
      - 'hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.sch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kicad-native-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check KiCad version
        run: docker run --rm kicad/kicad:10.0.6 kicad-cli version --format plain

      - name: Upgrade legacy schematic to native KiCad format
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-F-MASTER-BASELINE.sch"
          LOG="hardware/teststation/V1/CAD/verification/M2.9-K-UPGRADE-CLI.log"
          mkdir -p "$(dirname "$LOG")"
          chmod -R a+rwX hardware/teststation/V1/CAD/verification hardware/teststation/V1/CAD/schematics
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work" -w /work kicad/kicad:10.0.6 \
            kicad-cli sch upgrade --force "$LEGACY" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          NATIVE="${LEGACY%.sch}.kicad_sch"
          test -s "$NATIVE"
          cp "$NATIVE" "hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch"

      - name: Persist KiCad upgrade diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAZAO EVSE Engineering Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LOG="hardware/teststation/V1/CAD/verification/M2.9-K-UPGRADE-CLI.log"
          if test -s "$LOG"; then
            git add "$LOG"
            git commit -m "ci(teststation): persist M2.9-K KiCad upgrade diagnostics" || true
            git push || true
          else
            echo "No KiCad CLI diagnostic log was produced."
          fi

      - name: Run native schematic ERC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardware/teststation/V1/CAD/verification/erc
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work kicad/kicad:10.0.6 kicad-cli sch erc             --format report             --severity-all             --output hardware/teststation/V1/CAD/verification/erc/M2.9-K-MASTER-ERC.rpt             hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch || true

      - name: Write conversion status
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch"
          ERC="hardware/teststation/V1/CAD/verification/erc/M2.9-K-MASTER-ERC.rpt"
          {
            echo "# M2.9-K Native KiCad Conversion — CI Result"
            echo
            echo "**KiCad image:** `kicad/kicad:10.0.6`"
            echo
            echo "**Native schematic:** `$NATIVE`"
            echo
            echo "**ERC report:** `$ERC`"
            echo
            echo "The native file was generated by KiCad CLI `sch upgrade`, not by hand-written S-expression fabrication."
            echo
            echo "The current legacy source remains a notes-based engineering baseline. Therefore native conversion does **not** imply a complete electrically connected schematic."
            echo
            echo "ERC is archived for engineering review; zero violations, if observed, must not be interpreted as proof of complete circuit connectivity."
            echo
            echo "## Gates"
            echo "- Native file generated by KiCad: YES"
            echo "- Native schematic electrically complete: NO — pending connected schematic implementation"
            echo "- ERC executed: YES"
            echo "- DRC: PENDING"
            echo "- Fabrication: NOT AUTHORIZED"
            echo "- Mains energization: NOT AUTHORIZED"
          } > hardware/teststation/V1/CAD/verification/M2.9-K-NATIVE-CI-RESULT.md

      - name: Commit generated native schematic and ERC
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAZAO EVSE Engineering Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             hardware/teststation/V1/CAD/schematics/TS-V1-M2.9-K-MASTER.kicad_sch             hardware/teststation/V1/CAD/verification/erc/M2.9-K-MASTER-ERC.rpt             hardware/teststation/V1/CAD/verification/M2.9-K-NATIVE-CI-RESULT.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(teststation): generate M2.9-K native KiCad schematic"
          git push
