name: CAD envelope evidence validation

on:
  pull_request:
    paths:
      - 'schemas/cad/**'
      - 'tools/cad/**'
      - 'tests/cad/**'
      - 'requirements-cad-validation.txt'
      - '.github/workflows/cad-envelope-validation.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/cad/**'
      - 'tools/cad/**'
      - 'tests/cad/**'
      - 'requirements-cad-validation.txt'
      - '.github/workflows/cad-envelope-validation.yml'

permissions:
  contents: read

jobs:
  validate-cad-evidence-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-cad-validation.txt
      - name: Validate JSON Schema
        run: |
          python -c "import json; from jsonschema import Draft202012Validator; schema=json.load(open('schemas/cad/component-envelope-record.schema.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); print('JSON Schema valid')"
      - name: Run validator unit tests
        run: python -m unittest discover -s tests/cad -v
