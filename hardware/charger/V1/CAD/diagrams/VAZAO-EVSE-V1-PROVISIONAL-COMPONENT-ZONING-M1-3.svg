<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>VAZÃO EVSE V1 provisional component and interface layout</title>
  <desc>Conceptual single-output AC EVSE enclosure zoning and functional interfaces. Not a wiring or construction drawing.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fa}.panel{fill:#fff;stroke:#263445;stroke-width:3}.zone{fill:#eef2f7;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}
      .power{fill:#fff1e8;stroke:#b45309;stroke-width:2}.control{fill:#eaf3ff;stroke:#2563eb;stroke-width:2}
      .measure{fill:#e9f8ef;stroke:#15803d;stroke-width:2}.comms{fill:#f4edff;stroke:#7e22ce;stroke-width:2}
      .hold{fill:#fff7d6;stroke:#a16207;stroke-width:2}.t{font: bold 22px Arial,sans-serif;fill:#172033}
      .s{font:17px Arial,sans-serif;fill:#263445}.xs{font:14px Arial,sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:3;fill:none}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1050"/>
  <text x="60" y="58" class="t" style="font-size:32px">VAZÃO EVSE — Charger Hardware V1</text>
  <text x="60" y="91" class="s">Provisional component zoning and interface map · Single-output AC Mode 3 · Rev M1.3 · 2026-10-30</text>
  <rect x="60" y="125" width="1020" height="790" rx="12" class="panel"/>
  <text x="85" y="163" class="t">ENC1 — enclosure / mounting plate (not dimensioned)</text>
  <rect x="90" y="190" width="950" height="190" rx="8" class="zone"/>
  <text x="112" y="222" class="t">ZONE C — incoming supply and protection (power domain)</text>
  <rect x="125" y="250" width="180" height="90" rx="6" class="power"/>
  <text x="145" y="284" class="t">TB-IN</text><text x="145" y="311" class="s">Incoming terminals</text>
  <rect x="345" y="250" width="160" height="90" rx="6" class="power"/>
  <text x="390" y="284" class="t">QF1</text><text x="363" y="311" class="s">Protection — TBD</text>
  <rect x="545" y="250" width="180" height="90" rx="6" class="power"/>
  <text x="595" y="284" class="t">RCD1</text><text x="562" y="311" class="s">RCD / RDC-DD — TBD</text>
  <rect x="765" y="250" width="230" height="90" rx="6" class="power"/>
  <text x="830" y="284" class="t">SPD1</text><text x="790" y="311" class="s">Surge protection — TBD</text>
  <path d="M305 295 H345 M505 295 H545 M725 295 H765" class="line" marker-end="url(#arr)"/>
  <rect x="90" y="410" width="950" height="210" rx="8" class="zone"/>
  <text x="112" y="442" class="t">ZONE B — switching and energy measurement (power domain)</text>
  <rect x="135" y="475" width="210" height="100" rx="6" class="power"/>
  <text x="205" y="512" class="t">KM1</text><text x="158" y="540" class="s">Power contactor — TBD</text><text x="155" y="561" class="xs">Auxiliary feedback required</text>
  <rect x="395" y="475" width="210" height="100" rx="6" class="measure"/>
  <text x="470" y="512" class="t">EM1</text><text x="415" y="540" class="s">Per-output meter — TBD</text><text x="416" y="561" class="xs">EM340 / EM24 candidates</text>
  <rect x="655" y="475" width="310" height="100" rx="6" class="power"/>
  <text x="775" y="512" class="t">X1 — Type 2</text><text x="680" y="540" class="s">Socket / tethered cable — TBD</text><text x="680" y="561" class="xs">CP / PP interface defined by EVSE controller</text>
  <path d="M505 340 V385 H240 V475 M345 525 H395 M605 525 H655" class="line" marker-end="url(#arr)"/>
  <rect x="90" y="650" width="950" height="225" rx="8" class="zone"/>
  <text x="112" y="682" class="t">ZONE A — control / SELV / communications</text>
  <rect x="130" y="715" width="240" height="110" rx="6" class="control"/>
  <text x="195" y="752" class="t">EVSE1</text><text x="150" y="780" class="s">Dedicated Mode 3 controller</text><text x="157" y="803" class="xs">Phoenix / Bender candidates</text>
  <rect x="410" y="715" width="190" height="110" rx="6" class="control"/>
  <text x="475" y="752" class="t">PS1</text><text x="428" y="780" class="s">Isolated SELV PSU</text><text x="442" y="803" class="xs">Rating and model TBD</text>
  <rect x="640" y="715" width="170" height="110" rx="6" class="comms"/>
  <text x="690" y="752" class="t">COM1</text><text x="658" y="780" class="s">Ethernet / optional</text><text x="670" y="803" class="xs">Wi-Fi / LTE modules</text>
  <rect x="850" y="715" width="150" height="110" rx="6" class="comms"/>
  <text x="892" y="752" class="t">RFID1</text><text x="865" y="780" class="s">Credential reader</text><text x="870" y="803" class="xs">Secure identity</text>
  <path d="M370 770 H410 M600 770 H640 M810 770 H850" class="dash"/>
  <path d="M250 715 V600 M500 715 V580 M810 715 V600" class="dash"/>
  <text x="1110" y="155" class="t">Functional interfaces</text>
  <rect x="1110" y="185" width="420" height="125" rx="8" class="hold"/>
  <text x="1135" y="220" class="t">HARDWARE HOLD POINTS</text>
  <text x="1135" y="251" class="s">• No terminal numbers or ratings frozen</text>
  <text x="1135" y="278" class="s">• No conductor sizes / torque values</text>
  <rect x="1110" y="340" width="420" height="145" rx="8" class="control"/>
  <text x="1135" y="375" class="t">Local safety control</text>
  <text x="1135" y="407" class="s">CP/PP state + interlocks + watchdog</text>
  <text x="1135" y="435" class="s">Contactor command and feedback</text>
  <text x="1135" y="463" class="s">Critical fault → safe de-energisation</text>
  <rect x="1110" y="515" width="420" height="135" rx="8" class="measure"/>
  <text x="1135" y="550" class="t">Metering and session data</text>
  <text x="1135" y="582" class="s">Per-output meter → local controller</text>
  <text x="1135" y="610" class="s">→ CPMS reconciliation (not safety)</text>
  <rect x="1110" y="680" width="420" height="145" rx="8" class="comms"/>
  <text x="1135" y="715" class="t">Network / CPMS boundary</text>
  <text x="1135" y="747" class="s">Internet loss must not defeat local safety</text>
  <text x="1135" y="775" class="s">Offline policy and sync require validation</text>
  <text x="60" y="960" class="t" style="font-size:20px;fill:#991b1b">NOT FOR CONSTRUCTION · NOT A WIRING DIAGRAM · NOT AUTHORIZATION TO ENERGIZE</text>
  <text x="60" y="992" class="xs">Conceptual zoning only. Physical dimensions, clearances, heat, IP/IK, creepage, wiring routes and protective coordination remain unverified.</text>
</svg>